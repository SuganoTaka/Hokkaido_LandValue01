<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17211f">
    <title>北海道 地価マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="北海道 地価マップ">
        <span class="brand-mark" aria-hidden="true">地</span>
        <span>
          <strong>北海道 地価マップ</strong>
          <small>LAND VALUE / HOKKAIDO</small>
        </span>
      </a>
      <div class="topbar-note">公示地点・基準地点を地図で比較</div>
    </header>

    <main class="workspace">
      <aside class="filters" aria-label="地価地点の検索と絞り込み">
        <p class="eyebrow">LAND PRICE EXPLORER</p>
        <h1>地価情報を探す</h1>
        <label class="field-label" for="search">地点・住所を検索</label>
        <input id="search" class="search-input" type="search" placeholder="例：札幌市、旭川駅">

        <label class="field-label" for="municipality">自治体</label>
        <select id="municipality" class="select-input">
          <option value="">北海道全域</option>
        </select>

        <fieldset class="source-filters">
          <legend>データの種類</legend>
          <label class="source-option">
            <input id="filter-announcement" type="checkbox" checked>
            <span class="source-dot announcement"></span>
            <span>地価公示 <small id="announcement-year">---</small></span>
          </label>
          <label class="source-option">
            <input id="filter-survey" type="checkbox" checked>
            <span class="source-dot survey"></span>
            <span>都道府県地価調査 <small id="survey-year">---</small></span>
          </label>
        </fieldset>

        <div class="results" role="status" aria-live="polite">
          <strong id="result-count">地点データを読み込み中</strong>
          <span id="load-status">公式データを準備しています</span>
        </div>

        <section class="help-card">
          <h2>地図の使い方</h2>
          <p>地点にマウスを合わせると、価格・変動率・住所などを確認できます。クリックすると情報を固定表示します。</p>
          <p>自治体の選択肢は公式データに評価地点がある自治体のみです。</p>
        </section>

        <p class="data-source">
          出典：国土交通省 国土数値情報<br>
          地価公示・都道府県地価調査（CC BY 4.0）
        </p>
      </aside>

      <section class="map-stage" aria-label="北海道の地価情報地図">
        <div id="map" class="map" role="application" aria-label="OpenStreetMap 地価情報"></div>
        <div id="map-message" class="map-message" role="status">地図を読み込んでいます</div>
        <div class="map-legend" aria-label="地図の凡例">
          <span><i class="source-dot announcement"></i>地価公示</span>
          <span><i class="source-dot survey"></i>都道府県地価調査</span>
        </div>
        <button id="reset-view" class="reset-view" type="button">北海道全域を表示</button>
      </section>
    </main>
  </body>
</html>
